name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # A Go module is published by the tag itself, so there is no artifact to build and nothing to
  # upload. The only thing this workflow can still get wrong is publishing a tag that does not
  # pass, which is what gating on CI prevents.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The guard is for a release cut by hand before the tag reached the remote: `create` exits 1
      # on one that already exists, which fails the whole run and skips the proxy warming below
      # for a version that did in fact ship. `if` is what keeps that check out of `bash -e`.
      - name: create the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release; leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # proxy.golang.org only learns a version exists when something asks for it, and until it
      # does, `go get github.com/ulas96/kal@version` fails for everyone. This is that first ask.
      - name: warm the module proxy
        run: |
          curl -sSf "https://proxy.golang.org/github.com/ulas96/kal/@v/${GITHUB_REF_NAME}.info"
          curl -sSf "https://sum.golang.org/lookup/github.com/ulas96/kal@${GITHUB_REF_NAME}" >/dev/null
