name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this instead of restating the matrix, so a tag is gated by the same three
  # jobs a pull request is. A release workflow with its own weaker test step is how a tag ends
  # up published from a tree that never ran the DB-backed tests.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']

    # The TestDB* tests skip silently without DATABASE_URL, and a skipped test still reads as
    # "ok". In an auth library that silence would cover session revocation, token single-use and
    # the unique index — this service container is what keeps those tests from rotting into a
    # permanent skip that nobody notices.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # sslmode=disable because the service container speaks plain TCP. pg.ParseURL maps it to a
      # nil TLSConfig; anything other than its three known parameters is a hard parse error.
      - name: go test
        run: go test -race -count=1 ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

      - name: confirm the DB-backed tests actually ran
        run: |
          go test -v -count=1 ./tests/ | tee out.txt
          grep -q -- '--- PASS: TestDB' out.txt \
            || { echo "::error::no TestDB* test passed — they skipped, and a skip reads as ok"; exit 1; }
          ! grep -q -- '--- SKIP: TestDB' out.txt \
            || { echo "::error::a TestDB* test skipped despite the service container"; exit 1; }
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # check-latest matters here specifically: govulncheck reports standard-library
          # vulnerabilities against the toolchain that built the code, so a stale minor
          # version fails this job for reasons that have nothing to do with kal — and the
          # honest fix is the patched toolchain, not a suppression.
          check-latest: true

      # Pinned to @latest deliberately: a vulnerability scanner frozen at an old version stops
      # knowing about new vulnerabilities, which defeats the reason it is here.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...
